server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ===================================================================
    # Reverse Proxy: /api/* -> API container (internal Docker network)
    #
    # This makes the browser see a SINGLE origin (same host:port) for
    # both the SPA and the API. Cookies work without cross-origin issues.
    # The API container does NOT need to be exposed to the host.
    # ===================================================================
    location /api/ {
        proxy_pass http://gremius_api_prod:3000;
        proxy_http_version 1.1;

        # WebSocket support (for /api/realtime)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client info to the API
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running requests (file uploads, SSE)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Don't buffer responses (important for SSE/streaming)
        proxy_buffering off;

        # Allow large file uploads (media library)
        client_max_body_size 100m;
    }

    # ===================================================================
    # Gzip compression
    # ===================================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ===================================================================
    # Cache static assets (SvelteKit build hashes filenames)
    # ===================================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ===================================================================
    # SPA fallback — all non-file routes go to index.html
    # ===================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===================================================================
    # Security headers
    # ===================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

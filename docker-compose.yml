# ═══════════════════════════════════════════════════════════════════════════
# GremiusCMS — Docker Compose
#
# 🚀 USO RÁPIDO: docker compose up -d
#
# DUAL MODE (Opción A + B coexisten):
#   • Default (Vibecoder):  Pull de imágenes pre-builded  →  30 segundos
#   • --build (Developer):  Build desde source local      →  5-10 minutos
#
#   docker compose up -d              # Vibecoder: usa imágenes publicadas
#   docker compose up -d --build      # Developer: build desde código fuente
#
# PERFILES DISPONIBLES:
#   • (sin perfil)  — Solo core: Postgres + Valkey + API + Admin
#   • --profile s3  — Añade MinIO para storage S3-compatible
#   • --profile full — Todos los servicios incluyendo MinIO
#
# DEFAULT PARA DESARROLLO LOCAL:
#   MinIO está incluido por defecto para desarrollo sin dependencias externas.
#   En producción usa AWS S3, Cloudflare R2, u otro provider.
#
# Acceso local (con --profile s3):
#   • API + Swagger: http://localhost:3000/api/swagger
#   • Admin Panel:   http://localhost:3001
#   • MinIO Console: http://localhost:9001
#
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ═══════════════════════════════════════════════════════════════════════
  # PostgreSQL 16 con pgvector (REQUERIDO)
  # ═══════════════════════════════════════════════════════════════════════
  gremius_db:
    image: pgvector/pgvector:pg16
    container_name: gremius_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gremius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gremiuspassword}
      POSTGRES_DB: ${POSTGRES_DB:-gremius_prod}
    volumes:
      - gremius_postgres_prod:/var/lib/postgresql/data
      - ./docker/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gremius} -d ${POSTGRES_DB:-gremius_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gremius_net_prod

  # ═══════════════════════════════════════════════════════════════════════
  # Valkey 7 (REQUERIDO) - Cache, Pub/Sub, Queue backend
  # ═══════════════════════════════════════════════════════════════════════
  gremius_state:
    image: valkey/valkey:7-alpine
    container_name: gremius_state_prod
    restart: unless-stopped
    command: valkey-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - gremius_valkey_prod:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - gremius_net_prod

  # ═══════════════════════════════════════════════════════════════════════
  # MinIO (OPCIONAL) - S3-compatible storage para desarrollo local
  #
  # PERFILES: s3, full, dev
  # En producción se recomienda usar AWS S3, R2, u otro provider cloud.
  # ═══════════════════════════════════════════════════════════════════════
  gremius_minio:
    image: minio/minio:latest
    container_name: gremius_minio_prod
    restart: unless-stopped
    profiles: ["s3", "full", "dev"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-gremius_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-gremius_minio_secret_2025}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - gremius_minio_prod:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gremius_net_prod

  # ═══════════════════════════════════════════════════════════════════════
  # MinIO Init (OPCIONAL) - Crea bucket automáticamente
  # ═══════════════════════════════════════════════════════════════════════
  gremius_minio_init:
    image: minio/mc:latest
    container_name: gremius_minio_init_prod
    profiles: ["s3", "full", "dev"]
    depends_on:
      gremius_minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo 'Waiting for MinIO...' &&
        sleep 3 &&
        mc alias set local http://gremius_minio_prod:9000 ${S3_ACCESS_KEY:-gremius_minio} ${S3_SECRET_KEY:-gremius_minio_secret_2025} &&
        mc mb local/${S3_BUCKET:-gremius-media} --ignore-existing &&
        echo 'Bucket created: ${S3_BUCKET:-gremius-media}'
      "
    networks:
      - gremius_net_prod

  # ═══════════════════════════════════════════════════════════════════════
  # API - Backend (Bun + Hono) (REQUERIDO)
  #
  # DUAL MODE:
  #   • Vibecoder (default):  docker compose up -d
  #     Usa imagen pre-builded: gremius/api:latest
  #   • Developer:            docker compose up -d --build
  #     Build desde source con Dockerfile.prod
  #
  # Para forzar build sin afectar otros servicios:
  #   docker compose up -d --build gremius_api
  # ═══════════════════════════════════════════════════════════════════════
  gremius_api:
    image: ${GREMIUS_API_IMAGE:-gremius/api:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: api
    container_name: gremius_api_prod
    restart: unless-stopped
    depends_on:
      gremius_db:
        condition: service_healthy
      gremius_state:
        condition: service_healthy
      # MinIO es opcional - el API funciona con Local storage si no está
    environment:
      # Server
      - NODE_ENV=production
      - PORT=3000
      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gremius}:${POSTGRES_PASSWORD:-gremiuspassword}@gremius_db_prod:5432/${POSTGRES_DB:-gremius_prod}
      # Valkey
      - REDIS_URL=redis://gremius_state_prod:6379
      # Storage Configuration (configurable vía Media Library settings)
      - DEFAULT_STORAGE_PROVIDER=${DEFAULT_STORAGE_PROVIDER:-local}
      # MinIO/S3 (usado si DEFAULT_STORAGE_PROVIDER=minio)
      - S3_ENDPOINT=http://gremius_minio_prod:9000
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-gremius_minio}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-gremius_minio_secret_2025}
      - S3_BUCKET=${S3_BUCKET:-gremius-media}
      - S3_REGION=${S3_REGION:-us-east-1}
      # Local Storage (usado si DEFAULT_STORAGE_PROVIDER=local)
      - STORAGE_LOCAL_PATH=/app/uploads
      - STORAGE_LOCAL_URL=http://localhost:3000/uploads
      # Auth
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required - set it in .env}
      - BETTER_AUTH_URL=http://localhost:${API_PORT:-3000}
      # CORS
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:3001
      - ADMIN_URL=http://localhost:3001
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Features
      - ENABLE_SWAGGER=true
      - ENABLE_MCP=true
      # Rate limiting
      - RATE_LIMIT_ENABLED=true
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - gremius_net_prod
    command: ["sh", "/app/docker/start-with-check.sh"]

  # ═══════════════════════════════════════════════════════════════════════
  # Admin Panel - Frontend (SvelteKit) (REQUERIDO)
  #
  # DUAL MODE: Igual que API
  # ═══════════════════════════════════════════════════════════════════════
  gremius_admin:
    image: ${GREMIUS_ADMIN_IMAGE:-gremius/admin:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: admin
      # No PUBLIC_API_URL needed - admin uses relative /api/* URLs
      # which nginx proxies to the API container internally
    container_name: gremius_admin_prod
    restart: unless-stopped
    depends_on:
      - gremius_api
    ports:
      - "${ADMIN_PORT:-3001}:80"
    networks:
      - gremius_net_prod

volumes:
  gremius_postgres_prod:
    name: gremius_postgres_prod
    driver: local
  gremius_minio_prod:
    name: gremius_minio_prod
    driver: local
  gremius_valkey_prod:
    name: gremius_valkey_prod
    driver: local

networks:
  gremius_net_prod:
    name: gremius_net_prod
    driver: bridge

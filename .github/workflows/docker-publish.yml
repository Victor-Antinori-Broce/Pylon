name: Publish Docker Images

# Solo con una etiqueta `v*` o a mano: un push a main no publica nada. Así la
# primera imagen sale cuando el propietario lo decide (crear la etiqueta), no
# con el siguiente merge.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., 1.0.0)"
        required: false
        default: ""

# GHCR bajo el dueño del repositorio (2026-10-29): el espacio de nombres es
# suyo por definición, sin cuentas de terceros ni secretos: entra el
# GITHUB_TOKEN con `packages: write`. Antes era Docker Hub `gremius/*`, un
# nombre antiguo que nadie había reclamado: publicar ahí era entregar la imagen
# a quien lo registrara. Un paquete nuevo de GHCR nace PRIVADO; hacerlo público
# es un paso del propietario en la configuración del paquete.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: api
            dockerfile: ./docker/Dockerfile.prod
            target: api
            context: .
          - service: admin
            dockerfile: ./docker/Dockerfile.prod
            target: admin
            context: .
          - service: mcp
            dockerfile: ./docker/mcp/Dockerfile
            target: production
            context: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR exige el espacio de nombres en minúsculas
      - name: Image prefix
        run: echo "IMAGE_PREFIX=${GITHUB_REPOSITORY_OWNER,,}/kitsuden" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
            # a mano sin versión: la del commit, para que nunca salga sin etiqueta
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version == '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

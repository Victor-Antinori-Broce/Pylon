# ═══════════════════════════════════════════════════════════════════════════
# GremiusCMS — Vibecoder Mode 🚀
#
# Zero-config backend. Just run:
#   docker compose up -d --build
#
# Services:
#   • API + Swagger: http://localhost:3000/api/swagger
#   • Admin Panel:   http://localhost:3001
#   • MinIO Console: http://localhost:9001
# ═══════════════════════════════════════════════════════════════════════════

services:
  gremius_db:
    image: pgvector/pgvector:pg16
    container_name: ${PROJECT_NAME:-gremius}_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gremius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gremiuspassword}
      POSTGRES_DB: ${POSTGRES_DB:-gremius}
    volumes:
      - gremius_postgres:/var/lib/postgresql/data
      - ./docker/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gremius}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gremius_net

  gremius_state:
    image: valkey/valkey:7-alpine
    container_name: ${PROJECT_NAME:-gremius}_cache
    restart: unless-stopped
    command: valkey-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    ports:
      - "${CACHE_PORT:-6379}:6379"
    volumes:
      - gremius_valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - gremius_net

  gremius_minio:
    image: minio/minio:latest
    container_name: ${PROJECT_NAME:-gremius}_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-gremius_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-gremius_minio_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - gremius_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gremius_net

  gremius_api:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: api
    container_name: ${PROJECT_NAME:-gremius}_api
    restart: unless-stopped
    depends_on:
      gremius_db:
        condition: service_healthy
      gremius_state:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gremius}:${POSTGRES_PASSWORD:-gremiuspassword}@gremius_db:5432/${POSTGRES_DB:-gremius}
      - REDIS_URL=redis://gremius_state:6379
      - DEFAULT_STORAGE_PROVIDER=minio
      - S3_ENDPOINT=http://gremius_minio:9000
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-gremius_minio}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-gremius_minio_secret}
      - S3_BUCKET=${S3_BUCKET:-gremius-media}
      - S3_REGION=${S3_REGION:-us-east-1}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-change-me-in-production}
      - BETTER_AUTH_URL=http://localhost:${API_PORT:-3000}
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001
      - ADMIN_URL=http://localhost:3001
      - LOG_LEVEL=info
      - ENABLE_SWAGGER=true
      - ENABLE_MCP=true
      - RATE_LIMIT_ENABLED=true
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - gremius_net
    command: ["sh", "/app/docker/start-with-check.sh"]
    working_dir: /app/apps/api

  gremius_admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: admin
    container_name: ${PROJECT_NAME:-gremius}_admin
    restart: unless-stopped
    depends_on:
      - gremius_api
    ports:
      - "${ADMIN_PORT:-3001}:80"
    networks:
      - gremius_net

volumes:
  gremius_postgres:
  gremius_valkey:
  gremius_minio:

networks:
  gremius_net:
    driver: bridge

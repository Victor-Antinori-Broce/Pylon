# Worktree setup for agent IDEs that read orca.yaml (works with Orca).
# Takes effect when this site is its own repository (`kitsuden new`).
# Each worktree gets its own dev-server port; see scripts/orca-worktree.mjs.
scripts:
  setup: |
    pnpm install
    node scripts/orca-worktree.mjs setup
setupAgentStartupPolicy: wait-for-setup
defaultTabs:
  - title: Agent
  - title: Site
    command: node scripts/orca-worktree.mjs status

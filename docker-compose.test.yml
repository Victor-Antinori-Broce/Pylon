# ═══════════════════════════════════════════════════════════════════════════
# GremiusCMS — PostgreSQL para TESTS
#
# Servicio:
#   - PostgreSQL 16 + pgvector (puerto 5433)
#
# USO:
#   docker compose -f docker-compose.test.yml up -d
#
# NOTA: Esta DB es independiente de la DB de desarrollo (puerto 5432).
#       Se destruye y recrea limpia en cada ejecución de tests.
# ═══════════════════════════════════════════════════════════════════════════

services:
  gremius_test_db:
    image: pgvector/pgvector:pg16
    container_name: gremius_test_db
    environment:
      POSTGRES_USER: gremius
      POSTGRES_PASSWORD: gremius_test_2025
      POSTGRES_DB: gremius_test
    ports:
      - "5433:5432"
    volumes:
      - gremius_test_postgres_data:/var/lib/postgresql/data
      - ./docker/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gremius -d gremius_test"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      - gremius_net

volumes:
  gremius_test_postgres_data:
    name: gremius_test_postgres_data
    driver: local

networks:
  gremius_net:
    name: gremius_net
    driver: bridge

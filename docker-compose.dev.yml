# ═══════════════════════════════════════════════════════════════════════════
# Kitsuden — Infraestructura para DESARROLLO
#
# Servicios:
#   - PostgreSQL 16 + pgvector
#   - MinIO (S3-compatible storage)
#   - Valkey (Redis-compatible cache)
#
# USO:
#   docker compose -f docker-compose.dev.yml up -d
#
# NOTA: Las aplicaciones corren LOCALMENTE (pnpm dev), no en Docker.
#       Solo la infraestructura corre en contenedores.
# ═══════════════════════════════════════════════════════════════════════════

# Puertos solo en 127.0.0.1 por defecto (auditoría 2026-10-25), como en
# docker-compose.yml: `"5432:5432"` publicaba Postgres, Valkey y MinIO en todas
# las interfaces. Para abrirlos a la red, `BIND_ADDRESS=0.0.0.0` en `.env`.

services:
  # ═══════════════════════════════════════════════════════════════════════
  # PostgreSQL 16 con pgvector
  # ═══════════════════════════════════════════════════════════════════════
  kitsuden_db:
    image: pgvector/pgvector:pg16
    container_name: kitsuden_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kitsuden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kitsuden_dev}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kitsuden_postgres_data:/var/lib/postgresql/data
      - ./docker/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kitsuden} -d ${POSTGRES_DB:-kitsuden_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kitsuden_net

  # ═══════════════════════════════════════════════════════════════════════
  # MinIO (S3-compatible storage)
  # ═══════════════════════════════════════════════════════════════════════
  kitsuden_minio:
    image: quay.io/minio/minio:latest
    container_name: kitsuden_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # ⚠️ REQUIRED. Set S3_ACCESS_KEY and S3_SECRET_KEY in .env
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required - set it in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required - set it in .env}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - kitsuden_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kitsuden_net

  # ═══════════════════════════════════════════════════════════════════════
  # Valkey (Redis-compatible) OPCIONAL: cache y Pub/Sub compartidos entre replicas. La cola vive en Postgres.
  # ═══════════════════════════════════════════════════════════════════════
  kitsuden_cache:
    image: valkey/valkey:7-alpine
    container_name: kitsuden_cache
    restart: unless-stopped
    command: valkey-server --maxmemory 128mb --maxmemory-policy noeviction
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${VALKEY_PORT:-6379}:6379"
    volumes:
      - kitsuden_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - kitsuden_net

volumes:
  kitsuden_postgres_data:
    name: kitsuden_postgres_data
    driver: local

  kitsuden_minio_data:
    name: kitsuden_minio_data
    driver: local

  kitsuden_valkey_data:
    name: kitsuden_valkey_data
    driver: local

networks:
  kitsuden_net:
    name: kitsuden_net
    driver: bridge
